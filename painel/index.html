          <label for="np-obs">Observação do pedido</label>
          <textarea class="inp" id="np-obs" placeholder="Ex: tocar o interfone, mandar talheres…">${esc(f.obs)}</textarea>
        </div>
      </section>

      <section class="np-sec np-cat">
        <div class="busca">${ICO.busca}
          <input class="inp" id="np-busca" type="text" enterkeyhint="done" autocomplete="off" placeholder="Buscar produto… ex: frango, batata, brahma">
          <kbd>Enter adiciona</kbd>
        </div>
        <div class="cats" id="np-cats"></div>
        <div class="grid" id="np-grid"></div>
      </section>

      <section class="np-com">
        <div class="com-head"><h3>Itens do pedido</h3><span id="np-qtd"></span></div>
        <div class="com-itens" id="np-itens"></div>
        <div class="com-pe">
          <div class="f" style="flex-direction:row;align-items:center;gap:10px;margin-bottom:4px">
            <label for="np-desc" style="flex:1">Desconto (R$)</label>
            <input class="inp" id="np-desc" inputmode="decimal" placeholder="0,00" style="width:110px;padding:7px 10px" value="${esc(f.desconto)}">
          </div>
          <div id="np-totais"></div>
          <p class="np-erro" id="np-erro"></p>
          <button class="btn btn-pri criar" id="np-criar" onclick="criarPedido()">${ICO.check} Criar pedido</button>
        </div>
      </section>
    </div>`;

  // campos de texto → estado
  const liga = (id, campo, depois) => document.getElementById(id).addEventListener('input', e => { NP.f[campo] = e.target.value; e.target.classList.remove('erro'); depois?.(); });
  liga('np-tel', 'tel', aoDigitarTel);
  liga('np-nome', 'nome', aoDigitarNome);
  liga('np-end', 'endereco');
  liga('np-troco', 'troco');
  liga('np-obs', 'obs');
  liga('np-desc', 'desconto', pintarTotais);
  document.getElementById('np-nome').addEventListener('keydown', navegarSugestoes);
  document.getElementById('np-nome').addEventListener('blur', () => setTimeout(() => { document.getElementById('np-sug').hidden = true; }, 160));

  // botões segmentados
  const seg = (id, campo) => document.getElementById(id).addEventListener('click', e => {
    const b = e.target.closest('button[data-v]'); if (!b) return;
    NP.f[campo] = b.dataset.v; pintarSegs(); pintarTotais();
  });
  seg('np-canal', 'canal'); seg('np-tipo', 'tipo'); seg('np-pag', 'pag');

  const busca = document.getElementById('np-busca');
  busca.addEventListener('input', e => { NP.busca = e.target.value; pintarCatalogo(); });
  busca.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const primeiro = listaCatalogo()[0];
    if (primeiro) { addProduto(primeiro.id); busca.select(); }
  });

  pintarSegs(); pintarCatalogo(); pintarItens(); pintarCliente();
}

function pintarSegs() {
  const marca = (id, v) => document.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle('on', b.dataset.v === v));
  marca('np-canal', NP.f.canal); marca('np-tipo', NP.f.tipo); marca('np-pag', NP.f.pag);
  document.getElementById('np-end-box').hidden = NP.f.tipo !== 'delivery';
  document.getElementById('np-troco-box').hidden = NP.f.pag !== 'dinheiro';
}

// ─── CLIENTE ────────────────────────────────────────────────────────────────
let timerTel, timerNome;
function aoDigitarTel() {
  NP.cliente = null; NP.rascunho = null;
  clearTimeout(timerTel);
  const d = digs(NP.f.tel);
  if (d.length < 10) { pintarCliente(); return; }
  pintarCliente('busca');
  timerTel = setTimeout(buscarClientePorTel, 350);
}

async function buscarClientePorTel() {
  const tel = NP.f.tel;
  if (digs(tel).length < 10) return;
  const vs = variantes(tel);
  const [cli, rasc] = await Promise.all([
    sb.from('clientes').select('id, nome, telefone, endereco, total_pedidos, total_gasto, primeiro_pedido, ultimo_pedido')
      .in('telefone', vs).order('total_pedidos', { ascending: false }).limit(1),
    sb.from('pedido_rascunho').select('*').in('telefone', vs).limit(1),
  ]);
  if (NP.f.tel !== tel) return;   // continuaram digitando
  const c = cli.data?.[0] || null;
  NP.rascunho = rasc.data?.[0] && itensRascunho(rasc.data[0]).length ? rasc.data[0] : null;
  if (c) usarCliente(c, false);
  else { NP.cliente = null; pintarCliente(); }
}

function usarCliente(c, preencherTel) {
  NP.cliente = c;
  const nome = document.getElementById('np-nome');
  const end = document.getElementById('np-end');
  if (c.nome) { NP.f.nome = c.nome; nome.value = c.nome; nome.classList.remove('erro'); }
  if (c.endereco && !NP.f.endereco.trim()) { NP.f.endereco = c.endereco; end.value = c.endereco; }
  if (preencherTel) { NP.f.tel = telBonito(c.telefone); document.getElementById('np-tel').value = NP.f.tel; }
  document.getElementById('np-sug').hidden = true;
  pintarCliente();
}

function pintarCliente(estado) {
  const st = document.getElementById('np-cli-st');
  const c = NP.cliente;
  if (estado === 'busca') st.innerHTML = `<div class="cli-st busca">Procurando cadastro…</div>`;
  else if (c) st.innerHTML = `<div class="cli-st ok">${ICO.check}<span><b>Cliente cadastrado</b> — ${Number(c.total_pedidos) || 0} pedido(s)${c.ultimo_pedido ? `, último em ${new Date(c.ultimo_pedido).toLocaleDateString('pt-BR', { timeZone: TZ })}` : ''}. O pedido entra no histórico dele.</span></div>`;
  else if (digs(NP.f.tel).length >= 10) st.innerHTML = `<div class="cli-st novo">${ICO.user}<span><b>Cliente novo</b> — será cadastrado ao criar o pedido.</span></div>`;
  else st.innerHTML = '';

  const r = NP.rascunho;
  document.getElementById('np-rasc').innerHTML = r && !NP.usouRascunho ? `
    <div class="rasc-box">
      <p><b>O agente estava montando um pedido deste cliente</b> (há ${idade(mins(r.updated_at))}): ${itensRascunho(r).map(i => `${Number(i.quantidade) || 1}× ${esc(i.nome)}`).join(', ')}</p>
      <button class="btn" onclick="puxarRascunho()">${ICO.chat} Puxar itens do WhatsApp</button>
    </div>` : '';
}

function aoDigitarNome() {
  clearTimeout(timerNome);
  const q = NP.f.nome.trim();
  // Já tem cliente achado pelo telefone: só está corrigindo o nome.
  if (NP.cliente || q.length < 2) { document.getElementById('np-sug').hidden = true; return; }
  timerNome = setTimeout(async () => {
    const { data } = await sb.from('clientes')
      .select('id, nome, telefone, endereco, total_pedidos, total_gasto, primeiro_pedido, ultimo_pedido')
      .ilike('nome', `%${q.replace(/[%_]/g, '')}%`)
      .order('ultimo_pedido', { ascending: false, nullsFirst: false })
      .limit(6);
    if (NP.f.nome.trim() !== q || NP.cliente) return;
    NP.sugestoes = data || [];
    pintarSugestoes();
  }, 250);
}

let sugAtiva = -1;
function pintarSugestoes() {
  const box = document.getElementById('np-sug');
  sugAtiva = -1;
  box.hidden = !NP.sugestoes.length;
  box.innerHTML = NP.sugestoes.map((c, i) => `
    <button type="button" data-i="${i}" onmousedown="event.preventDefault();usarSugestao(${i})">
      <b>${esc(c.nome)}</b>
      <span>${esc(telBonito(c.telefone))} · ${Number(c.total_pedidos) || 0} pedido(s)${c.endereco ? ' · ' + esc(c.endereco) : ''}</span>
    </button>`).join('');
}
function navegarSugestoes(e) {
  const box = document.getElementById('np-sug');
  if (box.hidden || !NP.sugestoes.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    sugAtiva = (sugAtiva + (e.key === 'ArrowDown' ? 1 : -1) + NP.sugestoes.length) % NP.sugestoes.length;
    box.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === sugAtiva));
  } else if (e.key === 'Enter' && sugAtiva >= 0) {
    e.preventDefault(); usarSugestao(sugAtiva);
  }
}
async function usarSugestao(i) {
  const c = NP.sugestoes[i];
  if (!c) return;
  usarCliente(c, true);
  const { data } = await sb.from('pedido_rascunho').select('*').in('telefone', variantes(c.telefone)).limit(1);
  NP.rascunho = data?.[0] && itensRascunho(data[0]).length ? data[0] : null;
  pintarCliente();
}

function puxarRascunho() {
  const r = NP.rascunho;
  if (!r) return;
  itensRascunho(r).forEach(i => {
    const prod = NP.produtos.find(p => p.id === i.produto_id);
    NP.itens.push({
      produto_id: i.produto_id || null,
      nome: prod ? prod.nome.trim() : String(i.nome || 'Item'),
      preco: prod ? efetivo(prod) : Number(i.preco_unitario) || 0,
      qtd: Math.max(1, Number(i.quantidade) || 1),
      obs: i.observacao || '',
    });
  });
  const set = (id, campo, v) => { if (v && !String(NP.f[campo]).trim()) { NP.f[campo] = v; document.getElementById(id).value = v; } };
  set('np-nome', 'nome', r.nome_cliente);
  set('np-end', 'endereco', r.endereco);
  if (r.tipo_entrega === 'delivery' || r.tipo_entrega === 'retirada') NP.f.tipo = r.tipo_entrega;
  const pg = norm(r.forma_pagamento);
  if (pg === 'pix' || pg === 'dinheiro') NP.f.pag = pg;   // "cartao" não diz se é crédito ou débito
  NP.usouRascunho = true;
  pintarSegs(); pintarCliente(); pintarItens(); pintarCatalogo();
  toast(`Itens do WhatsApp adicionados (${itensRascunho(r).length})`, 'ok');
}

// ─── CATÁLOGO ───────────────────────────────────────────────────────────────
function categorias() {
  const ordem = ['Porções', 'Lanches', 'Caldos', 'Pizzas', 'Marmitex', 'Bebidas'];
  const cats = [...new Set(NP.produtos.map(p => (p.categoria || 'Outros').trim()))];
  const pos = c => { const i = ordem.indexOf(c); return i < 0 ? 50 : i; };
  return cats.sort((a, b) => pos(a) - pos(b) || a.localeCompare(b));
}
function listaCatalogo() {
  const termos = sem(NP.busca).split(/\s+/).filter(Boolean);
  // Buscando: procura no cardápio inteiro, ignorando a aba — quem digita
  // "coca" quer a Coca, não quer saber em que categoria ela mora.
  // Ordem: nome que COMEÇA com o termo, depois palavra que começa com ele, depois o resto
  // ("frango" → Frango Frito Especial antes de X-Frango).
  if (termos.length) {
    const nota = p => { const n = sem(p.nome); return n.startsWith(termos[0]) ? 0 : (' ' + n).includes(' ' + termos[0]) ? 1 : 2; };
    return NP.produtos
      .filter(p => { const alvo = sem(p.nome + ' ' + p.categoria); return termos.every(t => alvo.includes(t)); })
      .map(p => [nota(p), p]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  }
  return NP.cat === 'Todos' ? NP.produtos : NP.produtos.filter(p => (p.categoria || 'Outros').trim() === NP.cat);
}
function pintarCatalogo() {
  const buscando = !!NP.busca.trim();
  document.getElementById('np-cats').innerHTML = ['Todos', ...categorias()].map(c => {
    const n = c === 'Todos' ? NP.produtos.length : NP.produtos.filter(p => (p.categoria || 'Outros').trim() === c).length;
    return `<button type="button" class="${!buscando && c === NP.cat ? 'on' : ''}" onclick="escolherCat('${esc(c)}')">${esc(c)}<small>${n}</small></button>`;
  }).join('');

  const lista = listaCatalogo();
  const noCarrinho = id => NP.itens.filter(i => i.produto_id === id).reduce((s, i) => s + i.qtd, 0);
  document.getElementById('np-grid').innerHTML = lista.map((p, i) => {
    const q = noCarrinho(p.id), ef = efetivo(p);
    return `<button type="button" class="prod ${buscando && i === 0 ? 'primeiro' : ''}" onclick="addProduto('${p.id}')" title="${esc(p.categoria)}">
      ${q ? `<em>${q}</em>` : ''}
      <b>${esc(p.nome.trim())}</b>
      <span>${ef < Number(p.preco) ? `<s>${fmt(p.preco)}</s>` : ''}${fmt(ef)}</span>
    </button>`;
  }).join('') || `<div class="vazio">${ICO.busca}Nenhum produto encontrado para “${esc(NP.busca)}”.</div>`;
}
function escolherCat(c) {
  NP.cat = c; NP.busca = '';
  document.getElementById('np-busca').value = '';
  pintarCatalogo();
}

// ─── ITENS ──────────────────────────────────────────────────────────────────
function addProduto(id) {
  const p = NP.produtos.find(x => x.id === id);
  if (!p) return;
  // Item sem observação agrupa; com observação vira linha própria.
  const ex = NP.itens.find(i => i.produto_id === id && !i.obs.trim());
  if (ex) ex.qtd++;
  else NP.itens.push({ produto_id: p.id, nome: p.nome.trim(), preco: efetivo(p), qtd: 1, obs: '' });
  document.getElementById('np-erro').textContent = '';
  pintarItens(); pintarCatalogo();
}
function qtdItem(i, d) {
  const it = NP.itens[i]; if (!it) return;
  it.qtd += d;
  if (it.qtd < 1) NP.itens.splice(i, 1);
  pintarItens(); pintarCatalogo();
}
function obsItem(i, v) { if (NP.itens[i]) NP.itens[i].obs = v; }

function pintarItens() {
  const qtd = NP.itens.reduce((s, i) => s + i.qtd, 0);
  document.getElementById('np-qtd').textContent = qtd ? `${qtd} ${qtd === 1 ? 'item' : 'itens'}` : '';
  document.getElementById('np-itens').innerHTML = NP.itens.map((it, i) => `
    <div class="ci">
      <div class="ci-l"><span class="n">${esc(it.nome)}<small>${fmt(it.preco)} cada</small></span><span class="p">${fmt(it.preco * it.qtd)}</span></div>
      <div class="ci-r">
        <div class="step"><button type="button" onclick="qtdItem(${i},-1)" title="${it.qtd === 1 ? 'Remover' : 'Menos um'}">${it.qtd === 1 ? '×' : '−'}</button><span>${it.qtd}</span><button type="button" onclick="qtdItem(${i},1)">+</button></div>
        <input class="inp" placeholder="observação (ex: só peito, sem cebola)" value="${esc(it.obs)}" oninput="obsItem(${i}, this.value)">
      </div>
    </div>`).join('') || `<div class="com-vazio">Nenhum item ainda.<br>Busque ou toque nos produtos ao lado.</div>`;
  pintarTotais();
}

function totaisNP() {
  const sub = r2(NP.itens.reduce((s, i) => s + i.preco * i.qtd, 0));
  const taxa = NP.f.tipo === 'delivery' ? TAXA_ENTREGA_FIXA : 0;
  const desc = Math.min(sub, Math.max(0, r2(num(NP.f.desconto))));
  return { sub, taxa, desc, total: r2(sub + taxa - desc) };
}
function pintarTotais() {
  const t = totaisNP();
  document.getElementById('np-totais').innerHTML = `
    <div class="soma"><span>Subtotal</span><span>${fmt(t.sub)}</span></div>
    ${NP.f.tipo === 'delivery' ? `<div class="soma"><span>Taxa fixa de entrega</span><span>${fmt(t.taxa)}</span></div>` : ''}
    ${t.desc ? `<div class="soma"><span>Desconto</span><span>-${fmt(t.desc)}</span></div>` : ''}
    <div class="soma final"><span>Total</span><span>${fmt(t.total)}</span></div>`;
  const b = document.getElementById('np-criar');
  if (b && !NP.enviando) b.innerHTML = `${ICO.check} Criar pedido${t.total ? ' · ' + fmt(t.total) : ''}`;
}

// ─── GRAVAR ─────────────────────────────────────────────────────────────────
async function criarPedido() {
  if (NP.enviando) return;
  const f = NP.f, erro = document.getElementById('np-erro');
  const marca = (id, msg) => { const el = document.getElementById(id); el?.classList.add('erro'); el?.focus(); erro.textContent = msg; };
  erro.textContent = '';

  const nome = f.nome.trim();
  const endereco = f.tipo === 'delivery' ? f.endereco.trim() : null;
  const t = totaisNP();
  if (digs(f.tel).length < 10) return marca('np-tel', 'Informe o telefone com DDD.');
  if (nome.length < 2) return marca('np-nome', 'Informe o nome do cliente.');
  if (f.tipo === 'delivery' && (!endereco || endereco.length < 4)) return marca('np-end', 'Informe o endereço de entrega.');
  if (!NP.itens.length) { erro.textContent = 'Adicione pelo menos 1 item.'; document.getElementById('np-busca').focus(); return; }
  let troco = null;
  if (f.pag === 'dinheiro' && f.troco.trim()) {
    troco = r2(num(f.troco));
    if (!(troco > 0)) return marca('np-troco', 'Valor do troco inválido.');
    if (troco < t.total) return marca('np-troco', `O troco (${fmt(troco)}) é menor que o total (${fmt(t.total)}).`);
  }

  const btn = document.getElementById('np-criar');
  NP.enviando = true; btn.disabled = true; btn.textContent = 'Criando pedido…';

  let pedidoId = null;
  try {
    const tel = telBanco(f.tel);

    // 1. cliente: o achado na tela, ou uma última busca por todas as variantes
    let cli = NP.cliente;
    if (!cli) {
      const { data } = await sb.from('clientes').select('id, nome, endereco, total_pedidos, total_gasto, primeiro_pedido')
        .in('telefone', variantes(tel)).order('total_pedidos', { ascending: false }).limit(1);
      cli = data?.[0] || null;
    }
    if (cli) {
      const patch = {};
      if (nome !== cli.nome) patch.nome = nome;
      if (endereco && endereco !== cli.endereco) patch.endereco = endereco;
      if (Object.keys(patch).length) await sb.from('clientes').update(patch).eq('id', cli.id);
    } else {
      const r = await sb.from('clientes').insert({ nome, telefone: tel, endereco, total_pedidos: 0, total_gasto: 0 })
        .select('id, total_pedidos, total_gasto, primeiro_pedido').single();
      if (r.error) throw r.error;
      cli = r.data;
    }

    // 2. pedido
    const r = await sb.from('pedidos').insert({
      cliente_id: cli.id, status: 'pendente', tipo_entrega: f.tipo, endereco_entrega: endereco,
      forma_pagamento: f.pag, troco_para: troco,
      subtotal: t.sub, taxa_entrega: t.taxa, desconto: t.desc, total: t.total,
      observacao: [f.obs.trim(), `Pagamento na ${f.tipo === 'retirada' ? 'retirada' : 'entrega'}`].filter(Boolean).join(' · '), canal: f.canal,
    }).select('id, numero_pedido').single();
    if (r.error) throw r.error;
    pedidoId = r.data.id;

    // 3. itens — se falhar, desfaz o pedido para não sobrar comanda vazia
    const ri = await sb.from('itens_pedido').insert(NP.itens.map(i => ({
      pedido_id: pedidoId, produto_id: i.produto_id, nome_produto: i.nome, preco_unitario: i.preco,
      quantidade: i.qtd, observacao: i.obs.trim() || null, total: r2(i.preco * i.qtd),
    })));
    if (ri.error) { await sb.from('pedidos').delete().eq('id', pedidoId); throw ri.error; }

    // 4. estatísticas do cliente (mesma conta do agente e do cardápio)
    const agora = new Date().toISOString();
    await sb.from('clientes').update({
      total_pedidos: (Number(cli.total_pedidos) || 0) + 1,
      total_gasto: r2((Number(cli.total_gasto) || 0) + t.total),
      ultimo_pedido: agora, data_ultima_interacao: agora,
      ...(cli.primeiro_pedido ? {} : { primeiro_pedido: agora }),
    }).eq('id', cli.id);

    // 5. o pedido do WhatsApp foi fechado aqui: tira o rascunho para o agente
    //    não fechar o mesmo pedido de novo se o cliente responder depois.
    if (NP.usouRascunho) await sb.from('pedido_rascunho').delete().in('telefone', variantes(tel));

    fecharNovoPedido(true);
    toast(`Pedido #${String(r.data.numero_pedido).padStart(3, '0')} criado — ${fmt(t.total)}`, 'ok');
    if (S.dia !== hojeISO()) mudarDia(null); else carregarPedidos();
    carregarRascunhos();
  } catch (e) {
    console.error(e);
    erro.textContent = 'Não foi possível criar o pedido: ' + (e.message || e);
  } finally {
    NP.enviando = false; btn.disabled = false; pintarTotais();
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// PRODUTOS — pausar (some do cardápio na hora), editar, adicionar e excluir.
// Mexe direto na tabela "produtos": vale pro cardápio, pro agente e pra cá.
// ═══════════════════════════════════════════════════════════════════════════
const PR = { rows: [], busca: '', filtro: 'todos', edit: null, salvando: false };
const prBase = n => String(n || '').replace(/\s*\((M|G|P|m[eé]dia|grande|pequena)\)\s*$/i, '').trim();
const prSemAc = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const prPreco = r => Number(r.preco_promocional) > 0 && Number(r.preco_promocional) < Number(r.preco)
  ? `<s>${fmt(r.preco)}</s>${fmt(r.preco_promocional)}` : fmt(r.preco);

async function abrirProdutos() {
  document.getElementById('fundo-prod').hidden = false;
  document.getElementById('dlg-prod').innerHTML = '<div class="dlg-corpo"><p class="nota">Carregando produtos…</p></div>';
  await carregarProdutos();
  pintarProdutos();
}
function fecharProdutos() { PR.edit = null; document.getElementById('fundo-prod').hidden = true; }
async function carregarProdutos() {
  const { data, error } = await sb.from('produtos').select('*').order('categoria').order('nome');
  if (error) { toast('Não foi possível carregar os produtos: ' + error.message); return; }
  PR.rows = data || [];
}

function pintarProdutos() {
  const dlg = document.getElementById('dlg-prod');
  if (PR.edit) return pintarEdicao(dlg);
  const termo = prSemAc(PR.busca);
  const lista = PR.rows.filter(r => (!termo || prSemAc(r.nome + ' ' + r.categoria).includes(termo))
    && (PR.filtro === 'todos' || (PR.filtro === 'pausados' ? r.disponivel === false : r.disponivel !== false)));
  const cats = [...new Set(lista.map(r => r.categoria || 'Outros'))];
  const nPaus = PR.rows.filter(r => r.disponivel === false).length;
  dlg.innerHTML = `
    <div class="dlg-top">
      <h2 style="margin:0;font-size:17px">Produtos do cardápio</h2>
      <button class="fechar" onclick="fecharProdutos()" title="Fechar (Esc)">${ICO.x}</button>
    </div>
    <div class="dlg-corpo">
      <div class="pr-barra">
        <input class="pr-in" id="pr-busca" placeholder="Buscar produto…" value="${esc(PR.busca)}" oninput="PR.busca=this.value;pintarListaProdutos()">
        <button class="btn btn-pri" onclick="novoProduto()">${ICO.mais} Novo produto</button>
      </div>
      <div class="pr-filtros">
        ${[['todos', 'Todos · ' + PR.rows.length], ['ativos', 'No cardápio · ' + (PR.rows.length - nPaus)], ['pausados', 'Pausados · ' + nPaus]]
          .map(([k, t]) => `<button class="${PR.filtro === k ? 'on' : ''}" onclick="PR.filtro='${k}';pintarProdutos()">${t}</button>`).join('')}
      </div>
      <p class="nota" style="margin:0">Pausar tira o produto do cardápio na hora, sem apagar. Use <b>Excluir</b> só para o que não volta mais.</p>
      <div id="pr-lista" style="display:flex;flex-direction:column;gap:6px">${listaProdutosHTML(lista, cats)}</div>
    </div>`;
}
function pintarListaProdutos() {
  const termo = prSemAc(PR.busca);
  const lista = PR.rows.filter(r => (!termo || prSemAc(r.nome + ' ' + r.categoria).includes(termo))
    && (PR.filtro === 'todos' || (PR.filtro === 'pausados' ? r.disponivel === false : r.disponivel !== false)));
  document.getElementById('pr-lista').innerHTML = listaProdutosHTML(lista, [...new Set(lista.map(r => r.categoria || 'Outros'))]);
}
function listaProdutosHTML(lista, cats) {
  if (!lista.length) return '<p class="nota">Nenhum produto encontrado.</p>';
  return cats.map(c => `<div class="pr-cat">${esc(c)}</div>` + lista.filter(r => (r.categoria || 'Outros') === c).map(r => `
    <div class="pr-linha${r.disponivel === false ? ' off' : ''}">
      <div class="pr-foto">${r.imagem_url ? `<img src="${esc(r.imagem_url)}" alt="" loading="lazy">` : 'sem foto'}</div>
      <div class="pr-info"><b>${esc(r.nome)}</b><small>${prPreco(r)}</small></div>
      <button class="pr-pausa${r.disponivel === false ? ' off' : ''}" onclick="pausarProduto('${r.id}')" title="${r.disponivel === false ? 'Voltar com o produto pro cardápio' : 'Tirar do cardápio por enquanto'}">${r.disponivel === false ? 'Pausado · ativar' : 'No cardápio · pausar'}</button>
      <button class="btn" onclick="editarProduto('${r.id}')">Editar</button>
    </div>`).join('')).join('');
}

async function pausarProduto(id) {
  const r = PR.rows.find(x => x.id === id); if (!r) return;
  const novo = r.disponivel === false;
  r.disponivel = novo; pintarListaProdutos();
  const { error } = await sb.from('produtos').update({ disponivel: novo }).eq('id', id);
  if (error) { r.disponivel = !novo; pintarListaProdutos(); return toast('Erro ao salvar: ' + error.message); }
  toast(novo ? `"${r.nome}" voltou pro cardápio` : `"${r.nome}" pausado — saiu do cardápio`, 'ok');
}

function novoProduto() {
  PR.edit = { nome: '', categoria: PR.rows[0]?.categoria || 'Porções', descricao: '', preco: '', preco_promocional: '', disponivel: true, destaque: false, imagem_url: null };
  pintarProdutos();
}
function editarProduto(id) { PR.edit = { ...PR.rows.find(x => x.id === id) }; pintarProdutos(); }

function pintarEdicao(dlg) {
  const r = PR.edit;
  const cats = [...new Set(PR.rows.map(x => x.categoria).filter(Boolean))];
  const foto = r._preview || r.imagem_url;
  const irmaos = r.nome ? PR.rows.filter(x => x.id !== r.id && x.categoria === r.categoria && prBase(x.nome) === prBase(r.nome)).length : 0;
  dlg.innerHTML = `
    <div class="dlg-top">
      <button class="fechar" style="margin:0" onclick="PR.edit=null;pintarProdutos()" title="Voltar">${ICO.esq}</button>
      <h2 style="margin:0;font-size:17px">${r.id ? 'Editar produto' : 'Novo produto'}</h2>
      <button class="fechar" onclick="fecharProdutos()" title="Fechar (Esc)">${ICO.x}</button>
    </div>
    <div class="dlg-corpo">
      <form class="pr-form" id="pr-form" onsubmit="event.preventDefault();salvarProduto()">
        <div class="pr-midia">
          <div class="pr-foto">${foto ? `<img src="${esc(foto)}" alt="">` : 'sem foto'}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <label class="btn" style="margin:0;text-transform:none;letter-spacing:0;font-size:13px;color:var(--text);cursor:pointer">${foto ? 'Trocar foto' : 'Enviar foto'}<input type="file" accept="image/*" hidden onchange="escolherFotoProduto(this)"></label>
            ${foto ? '<button type="button" class="btn del" onclick="PR.edit._semFoto=true;PR.edit._arquivo=null;PR.edit._preview=null;PR.edit.imagem_url=null;guardarFormProduto();pintarProdutos()">Remover foto</button>' : ''}
          </div>
        </div>
        <div><label>Nome <small>— para ter tamanhos, termine com (M) ou (G). Ex.: Combo Feijoada (G)</small></label>
          <input class="pr-in" name="nome" required value="${esc(r.nome || '')}"></div>
        <div class="dupla">
          <div><label>Categoria</label>
            <select class="pr-in" name="categoria" onchange="document.getElementById('pr-nova').hidden=this.value!=='__nova'">
              ${cats.map(c => `<option${c === r.categoria ? ' selected' : ''}>${esc(c)}</option>`).join('')}<option value="__nova">+ Nova categoria…</option>
            </select>
            <input class="pr-in" id="pr-nova" name="nova_cat" placeholder="Nome da nova categoria" style="margin-top:6px" hidden></div>
          <div><label>Preço (R$)</label><input class="pr-in" name="preco" inputmode="decimal" required placeholder="Ex.: 90" value="${r.preco ?? ''}"></div>
        </div>
        <div><label>Preço promocional (R$) <small>— opcional; deixe vazio se não tiver promoção</small></label>
          <input class="pr-in" name="preco_promocional" inputmode="decimal" placeholder="Ex.: 79,90" value="${r.preco_promocional ?? ''}"></div>
        <div><label>Descrição</label><textarea class="pr-in" name="descricao" placeholder="O que vem no prato">${esc(r.descricao || '')}</textarea></div>
        <div class="pr-sw"><span><b>No cardápio</b><small>Desligado = pausado (não aparece pro cliente)</small></span>
          <button type="button" class="pr-pausa${r.disponivel === false ? ' off' : ''}" onclick="guardarFormProduto();PR.edit.disponivel=PR.edit.disponivel===false;pintarProdutos()">${r.disponivel === false ? 'Pausado' : 'Ativo'}</button></div>
        ${irmaos ? `<p class="nota" style="margin:0">A foto vale também para os outros ${irmaos} tamanho(s) deste produto.</p>` : ''}
      </form>
    </div>
    <div class="dlg-pe">
      ${r.id ? '<button class="btn del" onclick="excluirProduto()">Excluir produto</button>' : ''}
      <button class="btn btn-pri" id="pr-salvar" style="flex:2" onclick="salvarProduto()">${PR.salvando ? 'Salvando…' : 'Salvar'}</button>
    </div>`;
}
function guardarFormProduto() {
  const f = document.getElementById('pr-form'); if (!f) return;
  const fd = new FormData(f);
  ['nome', 'descricao', 'preco', 'preco_promocional'].forEach(k => { PR.edit[k] = fd.get(k); });
  if (fd.get('categoria') !== '__nova') PR.edit.categoria = fd.get('categoria');
}
function escolherFotoProduto(inp) {
  const f = inp.files?.[0]; if (!f) return;
  guardarFormProduto();
  Object.assign(PR.edit, { _arquivo: f, _semFoto: false, _preview: URL.createObjectURL(f) });
  pintarProdutos();
}
async function comprimirFoto(file) {
  const img = await createImageBitmap(file);
  const max = 1200, k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', .85));
}
const numBR = v => { const t = String(v ?? '').trim().replace(/\s|R\$/g, ''); if (!t) return null; const n = parseFloat(t.includes(',') ? t.replace(/\./g, '').replace(',', '.') : t); return Number.isFinite(n) ? n : NaN; };

async function salvarProduto() {
  if (PR.salvando) return;
  guardarFormProduto();
  const r = PR.edit;
  const fd = new FormData(document.getElementById('pr-form'));
  const nome = String(r.nome || '').trim();
  let categoria = String(fd.get('categoria') || '');
  if (categoria === '__nova') categoria = String(fd.get('nova_cat') || '').trim();
  const preco = numBR(r.preco);
  const promo = numBR(r.preco_promocional);
  if (!nome) return toast('Preencha o nome do produto');
  if (!categoria) return toast('Escolha ou escreva a categoria');
  if (!(preco >= 0)) return toast('Preço inválido — use só números, ex.: 90 ou 79,90');
  if (Number.isNaN(promo)) return toast('Preço promocional inválido');
  PR.salvando = true; pintarProdutos();
  try {
    let imagem_url = r._semFoto ? null : (r.imagem_url || null);
    if (r._arquivo) {
      const slug = prSemAc(nome).replace(/[^a-z0-9]+/g, '-').slice(0, 40);
      const caminho = `${Date.now()}-${slug}.jpg`;
      const up = await sb.storage.from('produto-fotos').upload(caminho, await comprimirFoto(r._arquivo), { contentType: 'image/jpeg', upsert: true });
      if (up.error) throw up.error;
      imagem_url = sb.storage.from('produto-fotos').getPublicUrl(caminho).data.publicUrl;
    }
    const dados = { nome, categoria, descricao: String(r.descricao || '').trim() || null, preco, preco_promocional: promo, disponivel: r.disponivel !== false, imagem_url };
    const q = r.id
      ? sb.from('produtos').update(dados).eq('id', r.id).select().single()
      : sb.from('produtos').insert({ ...dados, destaque: false }).select().single();
    const { data, error } = await q;
    if (error) throw error;
    // mesma foto nos outros tamanhos do mesmo produto (M/G)
    const irmaos = PR.rows.filter(x => x.id !== data.id && x.categoria === categoria && prBase(x.nome) === prBase(nome) && x.imagem_url !== imagem_url);
    for (const x of irmaos) await sb.from('produtos').update({ imagem_url }).eq('id', x.id);
    toast(r.id ? 'Produto salvo' : `"${nome}" adicionado ao cardápio`, 'ok');
    PR.edit = null;
    await carregarProdutos();
  } catch (e) {
    console.error(e); toast('Erro ao salvar: ' + (e.message || e));
  } finally {
    PR.salvando = false; pintarProdutos();
  }
}

async function excluirProduto() {
  const r = PR.edit; if (!r?.id) return;
  if (!confirm(`Excluir "${r.nome}" de vez?\n\nSe for só por um tempo (acabou, fora de época), use PAUSAR — dá pra voltar depois.`)) return;
  const { error } = await sb.from('produtos').delete().eq('id', r.id);
  if (error) {
    // produto que já teve pedido não pode sumir do banco (o histórico aponta pra ele): pausa
    if (/foreign key|violates|23503/i.test(error.message + error.code)) {
      await sb.from('produtos').update({ disponivel: false }).eq('id', r.id);
      toast('Esse produto já tem pedidos no histórico, então foi PAUSADO em vez de excluído.', 'ok');
    } else return toast('Erro ao excluir: ' + error.message);
  } else toast(`"${r.nome}" excluído`, 'ok');
  PR.edit = null;
  await carregarProdutos(); pintarProdutos();
}
</script>
