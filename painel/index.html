<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Pedidos — Choppatinhas</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg:      #0E0B09;
    --panel:   #16120F;
    --card:    #1E1814;
    --card-hi: #272019;
    --line:    #2B231C;
    --line-2:  #3D3329;
    --text:    #F6EEE4;
    --dim:     #ACA092;
    --dim-2:   #74695E;
    --red:     #E2382E;
    --red-2:   #FF5A4F;
    --gold:    #F2B33D;
    --green:   #3FBE74;
    --blue:    #5B9BEF;
    --purple:  #B58CF5;
    --pink:    #F07AB4;
    --teal:    #3CC5BC;
    --r:       12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif; font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  svg { display: block; }
  [hidden] { display: none !important; }

  /* ─── BOTÕES BASE ──────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border: 1px solid var(--line-2); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 9px 14px; font-size: 13px; font-weight: 700;
    transition: .14s; white-space: nowrap;
  }
  .btn:hover { background: var(--card-hi); border-color: var(--dim-2); }
  .btn svg { width: 16px; height: 16px; }
  .btn-pri { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 6px 18px rgba(226,56,46,.28); }
  .btn-pri:hover { background: var(--red-2); border-color: var(--red-2); }
  .btn-pri:disabled { opacity: .55; cursor: wait; }
  .btn .bolha { background: var(--gold); color: #1A1408; font-style: normal; font-size: 11px; font-weight: 800; border-radius: 99px; padding: 1px 7px; }

  /* ─── TOPO ─────────────────────────────────────────────── */
  header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 16px;
    padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand img { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; }
  .brand b { font-size: 15px; font-weight: 800; letter-spacing: -.2px; display: block; line-height: 1.15; }
  .brand span { font-size: 10.5px; color: var(--dim-2); letter-spacing: 1.3px; text-transform: uppercase; font-weight: 700; }

  .dia { display: flex; align-items: center; gap: 4px; background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 3px; }
  .dia button { background: none; border: none; color: var(--dim); padding: 6px; border-radius: 7px; display: flex; }
  .dia button:hover:not(:disabled) { background: var(--card-hi); color: var(--text); }
  .dia button:disabled { opacity: .3; cursor: default; }
  .dia button svg { width: 16px; height: 16px; }
  .dia .rot { font-size: 12.5px; font-weight: 700; padding: 0 6px; white-space: nowrap; position: relative; cursor: pointer; }
  .dia .rot em { font-style: normal; color: var(--gold); }
  .dia .rot input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }

  .loja {
    display: inline-flex; align-items: center; gap: 7px; user-select: none;
    font-size: 12px; font-weight: 700; padding: 8px 12px; border-radius: 10px;
    border: 1px solid var(--line-2); background: var(--card); transition: .15s; white-space: nowrap;
  }
  .loja:hover { background: var(--card-hi); }
  .loja i { width: 8px; height: 8px; border-radius: 50%; display: block; }
  .loja.on { color: var(--green); } .loja.on i { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .loja.off { color: var(--red-2); } .loja.off i { background: var(--red-2); }

  .kpis { margin-left: auto; display: flex; gap: 6px; }
  .kpi { padding: 4px 12px; border-left: 1px solid var(--line); }
  .kpi:first-child { border-left: none; }
  .kpi .k { display: block; font-size: 9.5px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--dim-2); font-weight: 700; white-space: nowrap; }
  .kpi .v { font-size: 17px; font-weight: 800; letter-spacing: -.4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kpi.money .v { color: var(--gold); }
  .topo-acoes { display: flex; gap: 8px; }
  .som-controles { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 8px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .som-controles .btn { padding: 6px 10px; }
  .som-controles label { color: var(--dim-2); font-size: 11px; white-space: nowrap; }
  .som-controles input { width: 75px; accent-color: var(--gold); }

  .faixa {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 8px 16px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--line);
  }
  .faixa.passado { background: rgba(242,179,61,.1); color: var(--gold); }
  .faixa.som { background: rgba(226,56,46,.12); color: #FFB3AD; cursor: pointer; }
  .faixa.atendente { background: rgba(242,179,61,.16); color: #FFE0A3; justify-content: space-between; flex-wrap: wrap; }
  .atendente-lista { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; }
  .atendente-item { display: inline-flex; align-items: center; gap: 8px; }
  .atendente-item a { color: #FFE0A3; text-decoration: underline; }
  .faixa .btn { padding: 5px 11px; font-size: 12px; }

  /* ─── BOARD ────────────────────────────────────────────── */
  .board {
    flex: 1 1 auto; display: grid; gap: 12px; min-height: 0; padding: 12px;
    grid-template-columns: repeat(var(--ncol, 4), minmax(0, 1fr));
  }
  .col {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    display: flex; flex-direction: column; min-height: 0; min-width: 0; transition: background .15s, border-color .15s;
  }
  .col-head { flex: 0 0 auto; display: flex; align-items: center; gap: 9px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .col-head i { width: 9px; height: 9px; border-radius: 3px; }
  .col-head h2 { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: .1px; }
  .col-head .n {
    margin-left: auto; font-size: 12px; font-weight: 800; color: var(--text);
    background: var(--card-hi); min-width: 26px; text-align: center; border-radius: 7px; padding: 2px 7px;
  }
  .col-head .n.zero { color: var(--dim-2); background: var(--card); }
  .col-body { flex: 1 1 auto; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .col-body::-webkit-scrollbar { width: 7px; }
  .col-body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
  .col.alvo { background: #1D1712; border-color: var(--gold); }
  .vazio { color: var(--dim-2); font-size: 12.5px; text-align: center; padding: 34px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .vazio svg { width: 26px; height: 26px; opacity: .55; }

  /* ─── COMANDA ──────────────────────────────────────────── */
  .c {
    position: relative; overflow: hidden; flex: 0 0 auto;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 12px 13px 12px 16px; display: flex; flex-direction: column; gap: 9px;
    cursor: pointer; user-select: none;
    box-shadow: 0 3px 12px rgba(0,0,0,.3);
    transition: transform .14s, border-color .14s, box-shadow .14s, background .14s;
  }
  .c::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--faixa, var(--dim-2)); }
  .c:hover { transform: translateY(-1px); background: var(--card-hi); border-color: var(--line-2); box-shadow: 0 8px 22px rgba(0,0,0,.42); }
  .c.dragging { opacity: .35; }
  .c.flash { animation: fl 1.4s ease-out 3; }
  .c.atrasado { border-color: rgba(226,56,46,.55); }
  @keyframes fl { 0% { box-shadow: 0 0 0 0 rgba(242,179,61,.6); } 100% { box-shadow: 0 0 0 14px rgba(242,179,61,0); } }

  .c-top { display: flex; align-items: center; gap: 8px; }
  .num { font-size: 18px; font-weight: 900; letter-spacing: -.5px; font-variant-numeric: tabular-nums; line-height: 1; }
  .hora { font-size: 11.5px; color: var(--dim-2); font-weight: 600; font-variant-numeric: tabular-nums; }
  .age {
    margin-left: auto; display: inline-flex; align-items: center; gap: 4px;
    font-size: 11.5px; font-weight: 800; color: var(--dim); font-variant-numeric: tabular-nums;
    background: var(--card-hi); border-radius: 6px; padding: 3px 7px;
  }
  .age svg { width: 12px; height: 12px; }
  .age.w { color: var(--gold); background: rgba(242,179,61,.12); }
  .age.l { color: #fff; background: var(--red); }

  .nome { font-size: 15.5px; font-weight: 800; letter-spacing: -.2px; line-height: 1.2; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 800;
    padding: 3px 8px; border-radius: 99px; letter-spacing: .2px; white-space: nowrap;
    color: var(--tc, var(--dim)); background: color-mix(in srgb, var(--tc, var(--dim)) 14%, transparent);
  }
  .tag i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .end { font-size: 12px; color: var(--dim); line-height: 1.4; display: flex; gap: 6px; }
  .end svg { width: 13px; height: 13px; flex: 0 0 auto; margin-top: 1px; color: var(--dim-2); }

  .itens { display: flex; flex-direction: column; gap: 5px; padding: 9px 0; border-top: 1px dashed var(--line-2); border-bottom: 1px dashed var(--line-2); }
  .it { display: flex; gap: 8px; font-size: 13px; line-height: 1.35; }
  .it b {
    color: var(--gold); font-weight: 800; font-size: 11.5px; flex: 0 0 auto;
    background: rgba(242,179,61,.12); border-radius: 5px; padding: 1px 6px; height: fit-content; font-variant-numeric: tabular-nums;
  }
  .it .t { flex: 1; }
  .it .o { display: block; color: var(--gold); font-size: 11px; font-style: italic; margin-top: 2px; }
  .mais { font-size: 11.5px; color: var(--dim-2); }
  .c-obs { font-size: 12px; color: var(--gold); background: rgba(242,179,61,.08); border-radius: 7px; padding: 6px 8px; line-height: 1.35; }

  .base { display: flex; align-items: center; gap: 8px; }
  .tot { font-size: 18px; font-weight: 900; color: var(--text); letter-spacing: -.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pay { font-size: 9.5px; font-weight: 800; letter-spacing: .7px; text-transform: uppercase; padding: 3px 7px; border-radius: 5px; background: var(--card-hi); color: var(--dim); white-space: nowrap; }
  .pay-pix { background: rgba(63,190,116,.15); color: var(--green); }
  .pay-dinheiro { background: rgba(242,179,61,.15); color: var(--gold); }
  .pay-cartao { background: rgba(91,155,239,.15); color: var(--blue); }
  .acts { display: flex; gap: 5px; margin-left: auto; }
  .ico-btn {
    border: 1px solid var(--line-2); background: transparent; color: var(--dim);
    border-radius: 8px; width: 32px; height: 32px; display: grid; place-items: center; transition: .14s;
  }
  .ico-btn:hover { color: var(--text); border-color: var(--dim-2); background: var(--card-hi); }
  .ico-btn.del:hover { color: var(--red-2); border-color: var(--red-2); }
  .ico-btn svg { width: 15px; height: 15px; }
  .avancar {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    border: none; border-radius: 9px; padding: 10px; font-size: 13.5px; font-weight: 800;
    background: var(--gold); color: #1A1408; transition: .14s;
  }
  .avancar:hover { filter: brightness(1.08); }
  .avancar svg { width: 16px; height: 16px; }
  .avancar.verde { background: var(--green); color: #07160D; }
  .avancar.vermelho { background: var(--red); color: #fff; }

  /* ─── MODAIS ───────────────────────────────────────────── */
  .fundo {
    position: fixed; inset: 0; background: rgba(0,0,0,.68); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 22px; z-index: 40;
  }
  .dlg {
    background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px;
    width: 480px; max-width: 100%; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 26px 70px rgba(0,0,0,.6);
  }
  .dlg-top { display: flex; align-items: center; gap: 10px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .dlg-top .num { font-size: 26px; }
  .selo { font-size: 10px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; padding: 4px 9px; border-radius: 6px; background: var(--card-hi); color: var(--dim); }
  .fechar { margin-left: auto; background: none; border: none; color: var(--dim-2); padding: 4px; display: flex; border-radius: 7px; }
  .fechar:hover { color: var(--text); background: var(--card-hi); }
  .fechar svg { width: 20px; height: 20px; }
  .dlg-corpo { padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }
  .rotulo { font-size: 9.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--dim-2); font-weight: 800; margin-bottom: 5px; }
  .campo .v { font-size: 14px; line-height: 1.45; }
  .campo .v a { color: var(--gold); text-decoration: none; font-weight: 600; }
  .campo .v a:hover { text-decoration: underline; }
  .campo .v small { color: var(--dim); font-size: 12px; display: block; margin-top: 2px; }
  .dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .linha-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .linha-item:last-child { border-bottom: none; }
  .linha-item b { color: var(--gold); font-weight: 800; font-size: 11.5px; background: rgba(242,179,61,.12); border-radius: 5px; padding: 2px 7px; height: fit-content; }
  .linha-item .d { flex: 1; }
  .linha-item .un { display: block; color: var(--dim-2); font-size: 11px; margin-top: 2px; }
  .linha-item .ob { display: block; color: var(--gold); font-size: 11.5px; font-style: italic; margin-top: 3px; }
  .linha-item .pz { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; white-space: nowrap; }
  .somas { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 7px; }
  .soma { display: flex; justify-content: space-between; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .soma.final { font-size: 20px; font-weight: 900; color: var(--gold); letter-spacing: -.4px; padding-top: 5px; }
  .dlg-pe { display: flex; gap: 8px; padding: 14px 20px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .dlg-pe .btn { flex: 1; min-width: 110px; padding: 11px; }
  .dlg-pe .avancar { flex: 2; min-width: 160px; width: auto; }
  .btn.del:hover { color: var(--red-2); border-color: var(--red-2); }

  /* ─── PRODUTOS (pausar / editar / adicionar / excluir) ─── */
  .dlg-prod { width: 720px; }
  .pr-barra { display: flex; gap: 8px; flex-wrap: wrap; }
  .pr-barra input { flex: 1; min-width: 180px; }
  .pr-in { width: 100%; background: var(--card); border: 1px solid var(--line-2); color: var(--text); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 14px; outline: none; }
  .pr-in:focus { border-color: var(--gold); }
  textarea.pr-in { resize: vertical; min-height: 70px; }
  .pr-filtros { display: flex; gap: 6px; flex-wrap: wrap; }
  .pr-filtros button { border: 1px solid var(--line-2); background: var(--card); color: var(--dim); border-radius: 99px; padding: 5px 11px; font-size: 12px; font-weight: 700; }
  .pr-filtros button.on { background: var(--gold); border-color: var(--gold); color: #1A1408; }
  .pr-cat { font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--dim-2); font-weight: 800; margin: 6px 0 2px; }
  .pr-linha { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  .pr-linha.off { opacity: .55; }
  .pr-foto { width: 44px; height: 44px; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: var(--card-hi); display: grid; place-items: center; color: var(--dim-2); font-size: 11px; font-weight: 800; }
  .pr-foto img { width: 100%; height: 100%; object-fit: cover; }
  .pr-info { flex: 1; min-width: 0; }
  .pr-info b { display: block; font-size: 13.5px; line-height: 1.25; }
  .pr-info small { color: var(--gold); font-weight: 700; font-size: 12.5px; }
  .pr-info small s { color: var(--dim-2); font-weight: 400; margin-right: 5px; }
  .pr-pausa { border: 1px solid var(--line-2); border-radius: 99px; padding: 6px 12px; font-size: 12px; font-weight: 800; white-space: nowrap; background: rgba(63,190,116,.12); color: var(--green); border-color: rgba(63,190,116,.4); }
  .pr-pausa.off { background: rgba(255,90,79,.12); color: var(--red-2); border-color: rgba(255,90,79,.4); }
  .pr-form { display: flex; flex-direction: column; gap: 12px; }
  .pr-form label { display: block; font-size: 11px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--dim); margin-bottom: 5px; }
  .pr-form label small { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--dim-2); }
  .pr-midia { display: flex; gap: 12px; align-items: center; }
  .pr-midia .pr-foto { width: 84px; height: 64px; }
  .pr-sw { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-size: 13.5px; }
  .pr-sw small { display: block; color: var(--dim-2); font-size: 12px; }
  .btn.del { color: var(--red-2); }

  /* ─── RASCUNHOS ────────────────────────────────────────── */
  .rasc-lista { display: flex; flex-direction: column; gap: 8px; }
  .rasc {
    display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--line);
  }
  .rasc .d { flex: 1; min-width: 0; }
  .rasc .d b { display: block; font-size: 14px; }
  .rasc .d span { display: block; font-size: 12px; color: var(--dim); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nota { font-size: 12.5px; color: var(--dim); line-height: 1.5; margin: 0; }

  /* ─── NOVO PEDIDO ──────────────────────────────────────── */
  .np {
    background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px;
    width: 1320px; max-width: 100%; height: 92vh; display: flex; flex-direction: column;
    box-shadow: 0 26px 70px rgba(0,0,0,.6); overflow: hidden;
  }
  .np-head { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .np-head h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
  .np-head span { font-size: 12px; color: var(--dim-2); }
  .np-corpo {
    flex: 1 1 auto; min-height: 0; display: grid;
    grid-template-columns: 330px minmax(0, 1fr) 350px; grid-template-areas: "cli cat com";
  }
  .np-sec { min-height: 0; overflow-y: auto; padding: 16px 18px; }
  .np-sec::-webkit-scrollbar { width: 7px; }
  .np-sec::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
  .np-cli { grid-area: cli; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
  .np-cat { grid-area: cat; display: flex; flex-direction: column; gap: 12px; padding-bottom: 0; overflow: hidden; }
  .np-cat .grid { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px 4px 16px 0; margin-top: -8px; }
  .np-cat .grid::-webkit-scrollbar { width: 7px; }
  .np-cat .grid::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
  .np-com { grid-area: com; border-left: 1px solid var(--line); display: flex; flex-direction: column; padding: 0; background: #130F0C; }
  .np-h { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--dim-2); font-weight: 800; margin: 0 0 -4px; display: flex; align-items: center; gap: 8px; }
  .np-h:not(:first-child) { margin-top: 6px; }

  .f { display: flex; flex-direction: column; gap: 5px; position: relative; }
  .f label { font-size: 12px; font-weight: 600; color: var(--dim); }
  .inp {
    width: 100%; background: var(--card); border: 1px solid var(--line-2); border-radius: 9px;

  @media (max-width: 1280px) {

    .dlg { border-radius: 0; max-height: none; height: 100%; width: 100%; }
    .np { border-radius: 0; height: 100%; }
    .np-head span { display: none; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .busca kbd { display: none; }
  }

<body>

<header>

</header>

<div class="som-controles">

const digs  = s => String(s || '').replace(/\D/g, '');
// Aceita "6", "6,50", "1.250,00" e "6.5".
const num   = s => { let t = String(s ?? '').trim(); if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.'); const n = parseFloat(t); return Number.isFinite(n) ? n : 0; };
const nPed  = p => '#' + String(p.numero_pedido ?? '').padStart(3, '0');
const idxCol = st => COLS.findIndex(c => c.aceita.includes(norm(st)));
const itensDe = p => (p.itens_pedido || []).slice().sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)));

// ─── DATAS ──────────────────────────────────────────────────────────────────
function hojeISO() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}
function limites(dia) {
  const ini = new Date(`${dia}T00:00:00${FUSO}`);
  return { ini: ini.toISOString(), fim: new Date(ini.getTime() + 864e5).toISOString() };
}
function diaVizinho(dia, passo) {
  const d = new Date(`${dia}T12:00:00Z`);
  d.setUTCDate(d.getUTCDate() + passo);
  return d.toISOString().slice(0, 10);
}
const rotuloDia = dia => new Date(`${dia}T12:00:00Z`).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit', timeZone: 'UTC' }).replace('.', '');
const horaDe = iso => new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: TZ });
const dataHora = iso => new Date(iso).toLocaleString('pt-BR', { timeZone: TZ, day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const mins  = iso => Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
const idade = m => m < 1 ? 'agora' : m < 60 ? `${m} min` : `${Math.floor(m / 60)}h${m % 60 ? String(m % 60).padStart(2, '0') : ''}`;

// ─── TELEFONE ───────────────────────────────────────────────────────────────
// O banco guarda 55 + DDD + número (o agente grava como o WhatsApp entrega,
// às vezes sem o 9). Mesmas variantes do agente, para não duplicar cliente.
function telBanco(t) { const d = digs(t); return d.length <= 11 ? '55' + d : d; }
function variantes(t) {
  const d = telBanco(t);
  const vs = new Set([d]);
  const m = d.match(/^55(\d{2})(\d{8,9})$/);
  if (m) {
    const [, ddd, resto] = m;
    if (resto.length === 9 && resto[0] === '9') vs.add(`55${ddd}${resto.slice(1)}`);
    if (resto.length === 8) vs.add(`55${ddd}9${resto}`);
  }
  return [...vs];
}
function telBonito(t) {
  let d = digs(t);
  if (d.length >= 12 && d.startsWith('55')) d = d.slice(2);
  if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return t || '';
}

// ─── RÓTULOS ────────────────────────────────────────────────────────────────
function pagInfo(fp) {
  const t = norm(fp);
  if (!t) return null;
  if (t.includes('pix')) return { nome: 'PIX', cls: 'pix' };
  if (t.includes('dinheiro')) return { nome: 'Dinheiro', cls: 'dinheiro' };
  if (t.includes('deb')) return { nome: 'Débito', cls: 'cartao' };
  if (t.includes('cred')) return { nome: 'Crédito', cls: 'cartao' };
  if (t.includes('cart')) return { nome: 'Cartão', cls: 'cartao' };
  return { nome: fp, cls: '' };
}
function resumoPix(p) {
 const rotulos = { aguardando_comprovante: 'Aguardando comprovante', em_analise: 'Comprovante recebido · analisando', em_conferencia: 'Dados compatíveis · conferir na conta', divergente: 'Dados divergentes · verificar', inconclusivo: 'Leitura inconclusiva · verificar', confirmado: 'Recebimento confirmado pela equipe' };
 return rotulos[p.pix_status] || 'Aguardando comprovante';
}
function blocoPix(p) {
 if (norm(p.status) !== 'aguardando_pix') return '';
 const r = p.pix_resumo || {}, motivos = Array.isArray(r.motivos) ? r.motivos : [];
 return '<div class="pix-conferencia"><strong>' + esc(resumoPix(p)) + '</strong>' +
 (r.valor_lido != null ? '<p>Valor lido: ' + fmt(r.valor_lido) + ' · Pedido: ' + fmt(p.total) + '</p>' : '') +
 (r.data_lida ? '<p>Data lida: ' + esc(dataHora(r.data_lida)) + '</p>' : '') +
 (motivos.length ? '<p>' + motivos.map(esc).join('<br>') + '</p>' : '') +
 '<p>Conferência do arquivo não comprova crédito na conta. Verifique o recebimento antes de liberar.</p>' +
 '<button class="avancar" data-pedido="' + esc(p.id) + '" onclick="event.stopPropagation();confirmarPix(this.dataset.pedido)" ' + (p.pix_recebido_em ? '' : 'disabled') + '>Conferi na conta · liberar pedido</button></div>';
}
function codigoConferenciaPix() {
 let codigo = sessionStorage.getItem('chopp_pix_autorizacao');
 if (!codigo) { codigo = prompt('Informe o código de conferência Pix da equipe (obtido na configuração do Supabase).'); if (codigo?.trim()) sessionStorage.setItem('chopp_pix_autorizacao', codigo.trim()); }
 return codigo?.trim() || '';
}
async function confirmarPix(id) {
 const p = S.pedidos.find(p => p.id === id);
 if (!p?.pix_recebido_em || !confirm('Você conferiu no extrato o recebimento de ' + fmt(p.total) + ' para o pedido ' + nPed(p) + '? Confirmar libera o pedido para a cozinha.')) return;
 const codigo = codigoConferenciaPix(); if (!codigo) return;
 const {data,error} = await sb.rpc('pix_confirmar_recebimento', {p_pedido:id,p_autorizacao:codigo});
 if (error || data !== true) { if (/Código/.test(error?.message || '')) sessionStorage.removeItem('chopp_pix_autorizacao'); toast(error?.message || 'Não foi possível liberar o Pix. Recarregue e tente novamente.'); return; }
 await carregarPedidos(); bip(); toast('Recebimento confirmado. Pedido enviado para Novos.');
}
function tagPag(p) {
  const i = pagInfo(p.forma_pagamento);
  return i ? `<span class="pay pay-${i.cls}" title="${p.pix_status ? esc(resumoPix(p)) : 'Pagamento na ' + (p.tipo_entrega === 'retirada' ? 'retirada' : 'entrega')}">${esc(i.nome)}</span>` : '';
}
function origemDe(p) {
  const k = norm(p.canal);
  return k ? (ORIGENS[k] || { nome: p.canal, cor: 'var(--dim)' }) : null;
}
function tagOrigem(p) {
  const o = origemDe(p);
  return o ? `<span class="tag" style="--tc:${o.cor}" title="Origem do pedido"><i></i>${esc(o.nome)}</span>` : '';
}
// Cliente antigo = já tinha comprado antes DESTE pedido. Compara com o
// primeiro_pedido do cadastro (e não com total_pedidos, que cresce com o tempo
// e faria todo pedido antigo parecer de cliente antigo ao consultar o histórico).
function clienteAntigo(p) {
  const c = p.clientes;
  if (!c) return null;
  if (c.primeiro_pedido) return new Date(c.primeiro_pedido).getTime() < new Date(p.created_at).getTime() - 120000;
  return Number(c.total_pedidos) > 1;
}
function tagCliente(p) {
  const a = clienteAntigo(p);
  if (a === null) return '';
  return a
    ? `<span class="tag" style="--tc:var(--text)" title="${Number(p.clientes.total_pedidos) || ''} pedido(s) no total">${ICO.user.replace('<svg', '<svg width="11" height="11"')}Cliente antigo</span>`
    : `<span class="tag" style="--tc:var(--blue)">1º pedido</span>`;
}

montar();
carregarLoja();

carregarRascunhos();
carregarAtendimentos();
realtime();
prepararSom();

setInterval(carregarLoja, 60000);
setInterval(carregarRascunhos, 60000);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!document.getElementById('fundo-prod').hidden) return PR.edit ? (PR.edit = null, pintarProdutos()) : fecharProdutos();
    if (!document.getElementById('fundo-np').hidden) return fecharNovoPedido();
    if (!document.getElementById('fundo-rasc').hidden) return fecharRascunhos();
    return fecharDetalhe();
  }
  const digitando = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  const algumModal = [...document.querySelectorAll('.fundo')].some(f => !f.hidden);
  if (!digitando && !algumModal && (e.key === 'n' || e.key === 'N') && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault(); abrirNovoPedido();
  }
});

function montar() {
  document.querySelector('.btn-pri').innerHTML = `${ICO.mais} Novo pedido`;
  document.getElementById('board').innerHTML = COLS.map(c => `
    <section class="col" id="col-${c.id}" data-col="${c.id}" ${c.id === 'cancel' ? 'hidden' : ''}>
      <div class="col-head"><i style="background:${c.cor}"></i><h2>${c.nome}</h2><span class="n zero" id="n-${c.id}">0</span></div>
      <div class="col-body" id="body-${c.id}"></div>
    </section>`).join('');

  // drag & drop por listener (mais confiável que atributos inline)
  COLS.forEach(c => {
    const col = document.getElementById('col-' + c.id);
    let dentro = 0;
    col.addEventListener('dragenter', e => { e.preventDefault(); dentro++; col.classList.add('alvo'); });
    col.addEventListener('dragover',  e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
    col.addEventListener('dragleave', () => { if (--dentro <= 0) { dentro = 0; col.classList.remove('alvo'); } });
    col.addEventListener('drop', e => {
      e.preventDefault(); dentro = 0; col.classList.remove('alvo');
      const id = e.dataTransfer.getData('text/plain') || arrastando;
      arrastando = null;
      if (!id) return;
      if (c.id === 'cancel') return cancelar(id);   // cancelar por arraste pede confirmação
      mover(id, c.destino);
    });
  });
}

// ─── DIA DO QUADRO ──────────────────────────────────────────────────────────
// O quadro mostra SÓ os pedidos de um dia — hoje, por padrão. Assim que vira
// o dia, as colunas zeram: pedido de ontem parado em "Novos" não atrapalha a
// fila de hoje. Dias anteriores continuam a um clique, nas setas/calendário.
function renderDia() {
  const hoje = hojeISO();
  const ehHoje = S.dia === hoje;
  const nCancel = S.pedidos.filter(p => norm(p.status) === 'cancelado').length;
  document.getElementById('dia').innerHTML = `
    <button onclick="mudarDia('${diaVizinho(S.dia, -1)}')" title="Dia anterior">${ICO.esq}</button>
    <label class="rot" title="Escolher outra data">${ehHoje ? '<em>Hoje</em> · ' : ''}${rotuloDia(S.dia)}
      <input type="date" value="${S.dia}" max="${hoje}" onchange="mudarDia(this.value)">
    </label>
    <button onclick="mudarDia('${diaVizinho(S.dia, 1)}')" ${ehHoje ? 'disabled' : ''} title="Próximo dia">${ICO.dir}</button>
    <button onclick="alternarCancelados()" title="Mostrar / esconder cancelados" style="font-size:11.5px;font-weight:700;gap:5px;${S.mostrarCancel ? 'color:var(--red-2)' : ''}">${ICO.x.replace('<svg', '<svg width="13" height="13"')}${nCancel}</button>`;

  const aviso = document.getElementById('aviso-passado');
  aviso.hidden = ehHoje;
  if (!ehHoje) aviso.innerHTML = `Você está vendo os pedidos de <b>${rotuloDia(S.dia)}</b> <button class="btn" onclick="mudarDia(null)">Voltar para hoje</button>`;
  document.getElementById('kp-rot').textContent = ehHoje ? 'Vendido hoje' : 'Vendido no dia';
}

function mudarDia(dia) {
  const hoje = hojeISO();
  dia = !dia || dia > hoje ? hoje : dia;
  if (dia === S.dia) return;
  S.dia = dia;
  S.seguindoHoje = dia === hoje;
  S.primeira = true;
  S.vistos.clear();
  S.pedidos = [];
  render();
  carregarPedidos();
}

function alternarCancelados() {
  S.mostrarCancel = !S.mostrarCancel;
  render();
}

async function carregarPedidos() {
  const dia = S.dia;
  const { ini, fim } = limites(dia);
  const { data, error } = await sb
    .from('pedidos')
    .select('*, clientes(id, nome, telefone, endereco, total_pedidos, total_gasto, primeiro_pedido), itens_pedido(*)')
    .gte('created_at', ini)
    .lt('created_at', fim)
    .order('created_at', { ascending: false })
    .limit(500);
  if (dia !== S.dia) return;   // trocaram de dia enquanto carregava
  if (error) { toast('Erro ao carregar pedidos'); return; }
  const pix = await sb.from('pix_pedidos').select('*, clientes(id, nome, telefone, endereco, total_pedidos, total_gasto, primeiro_pedido)').gte('created_at', ini).lt('created_at', fim).in('status', ['aguardando_pix', 'cancelado']).order('created_at', { ascending: false }).limit(500);
  if (dia !== S.dia) return;
  const rascunhosPix = (pix.data || []).map(p => ({ ...p, itens_pedido: (p.itens || []).map(i => ({ ...i, nome_produto: i.nome, total: Number(i.quantidade) * Number(i.preco_unitario), created_at: p.created_at })) }));
  S.pedidos = [...(data || []), ...rascunhosPix].sort((a,b) => b.created_at.localeCompare(a.created_at));
  render();
  S.primeira = false;
}

// ─── RENDER ─────────────────────────────────────────────────────────────────
function render() {
  const visiveis = COLS.filter(c => c.id !== 'cancel' || S.mostrarCancel);
  document.getElementById('board').style.setProperty('--ncol', visiveis.length);
  document.getElementById('col-cancel').hidden = !S.mostrarCancel;

  COLS.forEach((c, i) => {
    let lista = S.pedidos.filter(p => idxCol(p.status) === i);
    // Etapas ativas: quem espera há mais tempo fica em cima. Finais: mais recentes em cima.
    if (i <= 3) lista = lista.slice().reverse();
    const n = document.getElementById('n-' + c.id);
    n.textContent = lista.length;
    n.classList.toggle('zero', !lista.length);
    document.getElementById('body-' + c.id).innerHTML =
      lista.length ? lista.map(p => comanda(p, i)).join('') : `<div class="vazio">${ICO.caixa}${i === 0 && S.dia === hojeISO() ? 'Nenhum pedido novo' : 'Nada aqui'}</div>`;
  });
  renderDia();
  kpis();
  if (S.aberto) {
    const p = S.pedidos.find(x => x.id === S.aberto);
    p ? pintarDetalhe(p) : fecharDetalhe();
  }
}

function comanda(p, i) {
  const cli = p.clientes || {};
  const itens = itensDe(p);
  const col = COLS[i];
  const prox = COLS[i + 1];
  const podeAvancar = col.acao && prox;
  // Tempo de espera só faz sentido no quadro de hoje (ontem tudo daria "30h").
  const ativo = i <= 3;
  const relogio = ativo && S.dia === hojeISO();
  const min = mins(p.created_at);
  const novo = !S.primeira && !S.vistos.has(p.id);
  S.vistos.add(p.id);

  const mostra = itens.slice(0, 4);
  const resto = itens.length - mostra.length;
  const delivery = p.tipo_entrega === 'delivery';
  const troco = norm(p.forma_pagamento) === 'dinheiro' && Number(p.troco_para) > Number(p.total)
    ? `<div class="c-obs">Troco para ${fmt(p.troco_para)} · levar ${fmt(p.troco_para - p.total)}</div>` : '';

  return `
  <article class="c ${novo ? 'flash' : ''} ${relogio && min >= 30 ? 'atrasado' : ''}" draggable="${col.id !== 'pix'}" data-id="${p.id}"
    style="--faixa:${col.cor}" onclick="abrir('${p.id}')"
    ondragstart="iniciar(event,'${p.id}')" ondragend="this.classList.remove('dragging')">
    <div class="c-top">
      <span class="num">${nPed(p)}</span>
      <span class="hora">${horaDe(p.created_at)}</span>
      ${relogio ? `<span class="age ${min >= 30 ? 'l' : min >= 15 ? 'w' : ''}" data-t="${p.created_at}">${ICO.rel}<span>${idade(min)}</span></span>` : ''}
    </div>
    <div>
      <div class="nome">${esc(cli.nome || 'Cliente')}</div>
    </div>
    ${tagOrigem(p) || tagCliente(p) ? `<div class="tags">${tagOrigem(p)}${tagCliente(p)}</div>` : ''}
    <div class="end">${delivery ? ICO.moto : ICO.loja}
      <span>${delivery ? esc(p.endereco_entrega || 'Sem endereço') : 'Retirada no local'}</span></div>
    <div class="itens">
      ${mostra.map(it => `<div class="it"><b>${it.quantidade}×</b><span class="t">${esc(it.nome_produto)}${it.observacao ? `<span class="o">${esc(it.observacao)}</span>` : ''}</span></div>`).join('')
        || '<div class="it"><span class="t" style="color:var(--dim-2)">sem itens</span></div>'}
      ${resto > 0 ? `<div class="mais">+ ${resto} ${resto === 1 ? 'item' : 'itens'} — clique para ver</div>` : ''}
    </div>
    ${p.observacao ? `<div class="c-obs">${esc(p.observacao)}</div>` : ''}
    ${troco}
    ${blocoPix(p)}
    <div class="base">
      <span class="tot">${fmt(p.total)}</span>
      ${tagPag(p)}
      <div class="acts">
        <button class="ico-btn" onclick="event.stopPropagation();imprimir('${p.id}')" title="Imprimir" ${norm(p.status) === 'aguardando_pix' ? 'disabled' : ''}>${ICO.print}</button>
        ${ativo ? `<button class="ico-btn del" onclick="event.stopPropagation();cancelar('${p.id}')" title="Cancelar pedido">${ICO.x}</button>` : ''}
      </div>
    </div>
    ${podeAvancar ? `<button class="avancar ${col.id === 'pronto' ? 'verde' : ''}" onclick="event.stopPropagation();mover('${p.id}','${prox.destino}')">${col.id === 'pronto' ? ICO.check : ''}${col.acao}${['novo','preparo'].includes(col.id) ? ICO.seta : ''}</button>` : ''}
  </article>`;
}

function kpis() {
  const validos = S.pedidos.filter(p => !['cancelado','aguardando_pix'].includes(norm(p.status)));
  const total = validos.reduce((s, p) => s + Number(p.total || 0), 0);
  const abertos = S.pedidos.filter(p => { const i = idxCol(p.status); return i >= 1 && i <= 3; }).length;
  document.getElementById('kp-total').textContent = fmt(total);
  document.getElementById('kp-qtd').textContent = validos.length;
  document.getElementById('kp-tm').textContent = fmt(validos.length ? total / validos.length : 0);
  document.getElementById('kp-ab').textContent = abertos;
  document.title = (abertos && S.seguindoHoje ? `(${abertos}) ` : '') + 'Painel de Pedidos — Choppatinhas';
}

function tick() {
  // Virada do dia: quem está olhando "hoje" passa sozinho para o dia novo,
  // e o quadro zera sem ninguém precisar recarregar a página.
  if (S.seguindoHoje && S.dia !== hojeISO()) {
    S.dia = '';            // força a troca em mudarDia
    mudarDia(null);
    toast('Virou o dia — o quadro foi zerado', 'ok');
    return;
  }
  document.querySelectorAll('.age[data-t]').forEach(el => {
    const m = mins(el.dataset.t);
    el.querySelector('span').textContent = idade(m);
    el.className = 'age ' + (m >= 30 ? 'l' : m >= 15 ? 'w' : '');
    el.closest('.c')?.classList.toggle('atrasado', m >= 30);
  });
}

// ─── DETALHE DO PEDIDO ──────────────────────────────────────────────────────
function abrir(id) {
  const p = S.pedidos.find(x => x.id === id);
  if (!p) return;
  S.aberto = id;
  pintarDetalhe(p);
  document.getElementById('fundo-det').hidden = false;
}
function fecharDetalhe() { S.aberto = null; document.getElementById('fundo-det').hidden = true; }

function pintarDetalhe(p) {
  const cli = p.clientes || {};
  const i = idxCol(p.status);
  const col = COLS[i] || {};
  const prox = COLS[i + 1];
  const podeAvancar = col.acao && prox;
  const ativo = i >= 0 && i <= 3;
  const tel = digs(cli.telefone);
  const antigo = clienteAntigo(p);
  const o = origemDe(p);

  document.getElementById('dlg').innerHTML = `
    <div class="dlg-top">
      <span class="num">${nPed(p)}</span>
      <span class="selo" style="color:${col.cor || 'var(--dim)'}">${NOME_STATUS[norm(p.status)] || esc(p.status)}</span>
      ${tagPag(p)}
      <button class="fechar" onclick="fecharDetalhe()" title="Fechar (Esc)">${ICO.x}</button>
    </div>

    <div class="dlg-corpo">
      ${blocoPix(p)}
      <div class="dupla">
        <div class="campo"><div class="rotulo">Cliente</div><div class="v">${esc(cli.nome || 'Cliente')}
          ${antigo === null ? '' : `<small>${antigo ? `Cliente antigo · ${Number(cli.total_pedidos) || '?'} pedidos · ${fmt(cli.total_gasto)} no total` : 'Primeiro pedido'}</small>`}</div></div>
        <div class="campo"><div class="rotulo">WhatsApp</div><div class="v">${tel ? `<a href="https://wa.me/${tel}" target="_blank" rel="noopener">${esc(telBonito(cli.telefone))}</a>` : '—'}</div></div>
      </div>

      <div class="dupla">
        <div class="campo"><div class="rotulo">Origem</div><div class="v">${o ? `<span class="tag" style="--tc:${o.cor}"><i></i>${esc(o.nome)}</span>` : '<span style="color:var(--dim-2)">não informada</span>'}</div></div>
        <div class="campo"><div class="rotulo">Recebido</div><div class="v">${dataHora(p.created_at)} <small>${idade(mins(p.created_at))} atrás</small></div></div>
      </div>

      <div class="campo">
        <div class="rotulo">${p.tipo_entrega === 'delivery' ? 'Entregar em' : 'Retirada'}</div>
        <div class="v">${p.tipo_entrega === 'delivery' ? esc(p.endereco_entrega || 'Endereço não informado') : 'O cliente retira no local'}</div>
      </div>

      ${p.observacao ? `<div class="campo"><div class="rotulo">Observação do pedido</div><div class="v" style="color:var(--gold)">${esc(p.observacao)}</div></div>` : ''}
      ${Number(p.troco_para) > 0 ? `<div class="campo"><div class="rotulo">Troco</div><div class="v">Troco para ${fmt(p.troco_para)} — levar ${fmt(Math.max(0, p.troco_para - p.total))}</div></div>` : ''}

      <div>
        <div class="rotulo" style="margin-bottom:4px">Itens</div>
        ${itensDe(p).map(it => `

// ─── MOVER (otimista) ───────────────────────────────────────────────────────
async function mover(id, novoStatus) {
  const p = S.pedidos.find(x => x.id === id);
  if (!p || norm(p.status) === norm(novoStatus)) return;

  if (norm(p.status) === 'aguardando_pix') {
    if (norm(novoStatus) !== 'cancelado') return toast('Confira o recebimento na conta e use o botão de liberação do Pix.');
    const codigo = codigoConferenciaPix(); if (!codigo) return;
    const { data, error } = await sb.rpc('pix_cancelar', { p_pedido: id, p_autorizacao: codigo });
    if (error || data !== true) toast('Não foi possível cancelar o Pix.');
    else await carregarPedidos();
    return;
  }
  if (norm(novoStatus) === 'aguardando_pix') return toast('Essa coluna recebe somente rascunhos de pagamento Pix.');
  const anterior = p.status;
  p.status = novoStatus;
  render();

  // .select() de volta: um UPDATE barrado (RLS, trigger) volta sem linhas e
  // sem erro — sem isto a tela mostraria um status que o banco não gravou.
  const { data, error } = await sb.from('pedidos')
    .update({ status: novoStatus, updated_at: new Date().toISOString() })
    .eq('id', id)
    .select('id');

  if (error || !data?.length) { p.status = anterior; render(); toast('Não foi possível mover o pedido'); }
}
function cancelar(id) {
  const p = S.pedidos.find(x => x.id === id);
  if (confirm(`Cancelar o pedido ${p ? nPed(p) : ''}${p?.clientes?.nome ? ' de ' + p.clientes.nome : ''}?`)) mover(id, 'cancelado');
}

let arrastando = null;
function iniciar(ev, id) {
  if (norm(S.pedidos.find(p => p.id === id)?.status) === 'aguardando_pix') { ev.preventDefault(); return; }
  arrastando = id;
  ev.dataTransfer.effectAllowed = 'move';
  ev.dataTransfer.setData('text/plain', id);  // sem isto o Firefox não inicia o arrasto
  ev.currentTarget.classList.add('dragging');
}

// Alertas de atendimento humano são persistidos em agente_pausas pelo agente.
// O painel consulta a tabela periodicamente para não depender de a tabela estar
// adicionada à publicação Realtime do projeto.
async function carregarAtendimentos() {
  const desde = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
  const { data, error } = await sb.from('agente_pausas')
    .select('id, telefone, motivo, pausado_ate, created_at')
    .gte('created_at', desde).order('created_at', { ascending: true }).limit(300);
  if (error) { console.warn('Não foi possível buscar solicitações de atendente:', error.message); return; }

  const ultimoPorTelefone = new Map();
  for (const item of data || []) ultimoPorTelefone.set(String(item.telefone || '').replace(/\D/g, ''), item);
  const pendentes = [...ultimoPorTelefone.values()]
    .filter(item => item.telefone && String(item.motivo || '').startsWith('handoff:'))
    .sort((a, b) => Date.parse(a.created_at) - Date.parse(b.created_at));

  if (atendimentosCarregados) {
    for (const item of pendentes) {
      if (alertasAtendenteVistos.has(item.id)) continue;
      alertasAtendenteVistos.add(item.id);
      toast(`Atendente solicitada para a conversa ${item.telefone}.`, 'ok');
      if (window.Notification && Notification.permission === 'granted') {
        new Notification('Atendimento humano solicitado', { body: `${item.telefone}: ${String(item.motivo).replace(/^handoff:\s*/, '')}` });
      }
    }
  }
  atendimentosCarregados = true;
  S.atendimentos = pendentes;

  const aviso = document.getElementById('aviso-atendente');
  if (!pendentes.length) { aviso.hidden = true; aviso.replaceChildren(); return; }
  aviso.hidden = false;
  aviso.innerHTML = `<b>Atendente solicitada (${pendentes.length})</b><div class="atendente-lista">${pendentes.map(item => {
    const telefone = String(item.telefone).replace(/\D/g, '');
    const motivo = String(item.motivo || '').replace(/^handoff:\s*/, '');
    return `<span class="atendente-item">${esc(telefone)} · ${esc(motivo)} <a href="https://web.whatsapp.com/send?phone=${encodeURIComponent(telefone)}" target="_blank" rel="noopener">Abrir conversa</a></span>`;
  }).join('')}</div>`;
}

// ─── REALTIME ───────────────────────────────────────────────────────────────
function realtime() {
  sb.channel('kanban')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pedidos' }, async ({ new: row }) => {
      bip();
      if (window.Notification && Notification.permission === 'granted') new Notification(`Novo pedido #${row.numero_pedido ?? ''} no Choppatinhas!`);
      if (S.dia === hojeISO()) await carregarPedidos();
      else toast(`Chegou o pedido #${row.numero_pedido ?? ''} — clique em "Voltar para hoje"`);
      carregarRascunhos();
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pedidos' }, ({ new: row }) => {
      const p = S.pedidos.find(x => x.id === row.id);
      if (!p) return;
      Object.assign(p, row, { clientes: p.clientes, itens_pedido: p.itens_pedido });
      render();
    })
.on('postgres_changes', { event: '*', schema: 'public', table: 'pix_pedidos' }, () => carregarPedidos())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'itens_pedido' }, () => carregarPedidos())
    .subscribe();

  if (window.Notification && Notification.permission === 'default') Notification.requestPermission();
}

// ─── SOM ────────────────────────────────────────────────────────────────────
// O navegador só toca som depois de um clique na página. Num painel que fica
// aberto o dia todo, isso vira alarme mudo sem ninguém perceber — então o
// painel avisa na tela enquanto o som estiver bloqueado.
function prepararSom() {
  try {
    const salvo = Number(localStorage.getItem('chopp_som_volume'));
    if (salvo >= 30 && salvo <= 100) SOM.volume = salvo / 100;
  } catch (e) { /* armazenamento indisponível */ }
  document.getElementById('som-volume').value = Math.round(SOM.volume * 100);
  document.getElementById('som-volume-valor').textContent = `${Math.round(SOM.volume * 100)}%`;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) {
    const aviso = document.getElementById('aviso-som');
    aviso.hidden = false;
    aviso.textContent = 'Este navegador não conseguiu iniciar o apito. Abra o painel no Chrome ou Edge.';
    return;
  }
  actx.onstatechange = atualizarEstadoSom;
  atualizarEstadoSom();
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, ativarSom, { passive: true }));
}
function atualizarEstadoSom() {
  const pronto = actx?.state === 'running';
  document.getElementById('aviso-som').hidden = pronto;
  document.getElementById('btn-som').textContent = pronto ? 'Testar apito' : 'Ativar apito';
  if (pronto && SOM.pendente) { SOM.pendente = false; bip(); }
}
async function ativarSom() {
  if (!actx) return false;
  try {
    if (actx.state !== 'running') await actx.resume();
    atualizarEstadoSom();
    return actx.state === 'running';
  } catch (e) { atualizarEstadoSom(); return false; }
}
async function testarSom() {
  // O teste já sinaliza qualquer pedido que chegou com o áudio bloqueado.
  SOM.pendente = false;
  if (await ativarSom()) bip();
  else toast('Não foi possível ativar o apito. Confira o navegador e a saída de áudio.');
}
function mudarVolumeSom(valor) {
  const n = Number(valor);
  if (!Number.isFinite(n)) return;
  const volume = Math.max(30, Math.min(100, n));
  SOM.volume = volume / 100;
  document.getElementById('som-volume-valor').textContent = `${volume}%`;
  try { localStorage.setItem('chopp_som_volume', String(volume)); } catch (e) { /* ok */ }
}
function bip() {
  if (!actx) return;
  if (actx.state !== 'running') {
    SOM.pendente = true;
    const aviso = document.getElementById('aviso-som');
    aviso.hidden = false;
    aviso.textContent = 'Chegou um pedido! Clique para ativar o apito e confira o volume do computador.';
    return;
  }
  try {
    // Três notas fixas e agudas. O ataque rápido dá presença ao apito;
    // a saída suave evita estalos e o intervalo separa cada nota.
    const inicio = Math.max(actx.currentTime + .02, SOM.proximo);
    SOM.proximo = inicio + 1.05;
    [0, .34, .68].forEach(t0 => {
      const o = actx.createOscillator(), g = actx.createGain(), t = inicio + t0;
      o.connect(g); g.connect(actx.destination);
      o.type = 'triangle';
      o.frequency.setValueAtTime(1950, t);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.92 * SOM.volume, t + .012);
      g.gain.setValueAtTime(.92 * SOM.volume, t + .19);
      g.gain.linearRampToValueAtTime(0, t + .27);
      o.onended = () => { o.disconnect(); g.disconnect(); };
      o.start(t); o.stop(t + .28);
    });
  } catch (e) { toast('Não foi possível tocar o apito. Use o botão Testar apito.'); }
}

let tt;
function toast(msg, tipo) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = (tipo === 'ok' ? 'ok ' : '') + 'on';
  clearTimeout(tt);
  tt = setTimeout(() => el.classList.remove('on'), tipo === 'ok' ? 3500 : 5000);
}

// RASCUNHOS DO WHATSAPP
// O agente monta o pedido em pedido_rascunho (um por telefone) e apaga quando
// fecha. Rascunho com itens que ficou parado = pedido que não foi finalizado.

function itensRascunho(r) {
  let v = r?.itens;
  if (typeof v === 'string') { try { v = JSON.parse(v); } catch (e) { v = []; } }
  return Array.isArray(v) ? v : [];
}

  if (error) return;
  S.rascunhos = (data || []).filter(r => !r.pedido_id && itensRascunho(r).length);
  const b = document.getElementById('btn-rasc');
  b.hidden = !S.rascunhos.length;
  b.innerHTML = `${ICO.chat} Não finalizados <i class="bolha">${S.rascunhos.length}</i>`;
  if (!document.getElementById('fundo-rasc').hidden) pintarRascunhos();
}
