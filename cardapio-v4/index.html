<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F0B09">
  <meta name="description" content="Choppatinhas — restaurante em Umuarama. Monte sua mesa: frango crocante, carnes na chapa e porções generosas. Peça online.">
  <title>Choppatinhas — Monte sua mesa</title>
  <link rel="icon" href="assets/mascote.png">
  <meta property="og:title" content="Choppatinhas — Monte sua mesa">
  <meta property="og:description" content="Escolha pra quantas pessoas e a gente te ajuda a montar o pedido.">
  <meta property="og:image" content="assets/logo-original.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cvukucgofhappavupaij.supabase.co" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="config.js" defer></script>
  <script src="art.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
<div class="app" id="app">

  <header class="topo">
    <h1 class="sr">Choppatinhas — monte sua mesa</h1>
    <button class="marca" id="btnInicio" aria-label="Voltar ao início">
      <img class="marca-pato" src="assets/mascote.png" alt="" width="34" height="34">
      <img class="marca-nome" src="assets/wordmark.png" alt="Choppatinhas" width="206" height="50">
    </button>
    <span class="topo-status" id="topoStatus"></span>
    <button class="topo-busca" id="btnBusca" aria-label="Buscar no cardápio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8" stroke-linecap="round"/></svg>
    </button>
  </header>

  <!-- ABERTURA: pra quantas pessoas? -->
  <section class="abertura" id="abertura">
    <div class="abre-midia" id="abreMidia"></div>
    <div class="abre-txt">
      <div class="abre-retorno" id="retorno" hidden></div>
      <p class="abre-sobre" id="abreSobre"></p>
      <h2 class="abre-tit">Monte<br>sua mesa.</h2>
      <button class="abre-cta" id="btnComecar"><span>Ver o cardápio</span><b>→</b></button>
      <div class="info3" id="info3"></div>
    </div>
  </section>

  <!-- CARDÁPIO GUIADO: prato → acompanhar → beber -->
  <section class="palco" id="palco" hidden>
    <nav class="passos" id="passos" aria-label="Etapas do pedido"></nav>
    <div class="paineis" id="paineis">
      <div class="painel" id="painel0" data-painel="0"></div>
      <div class="painel" id="painel1" data-painel="1"></div>
      <div class="painel" id="painel2" data-painel="2"></div>
    </div>
    <div class="busca-res" id="buscaRes" hidden></div>
  </section>

  <!-- BUSCA -->
  <div class="busca" id="busca" hidden>
    <input id="buscaInput" type="search" placeholder="Buscar: frango, picanha, batata…" autocomplete="off" enterkeyhint="search">
    <button id="buscaFechar">fechar</button>
  </div>

  <!-- SUGESTÃO NA MESA (depois de servir um prato) -->
  <div class="sug-mesa" id="sugMesa" hidden></div>

  <!-- A MESA (carrinho) -->
  <div class="mesa" id="mesa" hidden>
    <span class="mesa-frete"><i id="mesaFreteBarra"></i></span>
    <div class="mesa-in">
      <div class="mesa-pratos" id="mesaPratos" data-ver-mesa role="button" tabindex="0" aria-label="Ver sua mesa"></div>
      <button class="mesa-cta" data-ver-mesa><small id="mesaTotal"></small><b>Ver mesa</b></button>
    </div>
    <p class="mesa-dica" id="mesaDica"></p>
  </div>

  <!-- O PRATO DE PERTO -->
  <section class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="Prato" hidden></section>

  <!-- FECHAR A MESA: revisão → dados → acompanhar -->
  <section class="fechar" id="fechar" role="dialog" aria-modal="true" aria-label="Sua mesa" hidden></section>

</div>

<!-- ADMIN -->
<div class="adm-senha" id="admSenha" hidden>
  <form class="adm-senha-box" id="admSenhaForm">
    <img src="assets/mascote.png" alt="" width="56" height="56">
    <h3>Área da casa</h3>
    <p>Digite a senha do painel</p>
    <input type="password" id="admSenhaInput" inputmode="numeric" maxlength="12" placeholder="••••" autocomplete="off">
    <small class="adm-erro" id="admErro" hidden>Senha incorreta</small>
    <div class="adm-senha-acoes">
      <button type="button" class="btn-ghost" id="admCancelar">Cancelar</button>
      <button type="submit" class="btn-cta">Entrar</button>
    </div>
  </form>
</div>
<section class="adm" id="adm" hidden></section>

<div class="aviso" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
