<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D0A07">
  <meta name="description" content="Choppatinhas — restaurante em Umuarama. Frango crocante, carnes na chapa e porções generosas. Peça online em poucos toques.">
  <title>Choppatinhas — Cardápio</title>
  <link rel="icon" href="assets/mascote.png">
  <meta property="og:title" content="Choppatinhas — Cardápio">
  <meta property="og:description" content="O sabor do Choppatinhas, agora na sua casa. Peça online!">
  <meta property="og:image" content="assets/logo-original.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="config.js" defer></script>
  <script src="art.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>

  <!-- HEADER -->
  <header class="topo" id="topo">
    <div class="topo-in">
      <a class="marca" href="#" aria-label="Choppatinhas — início">
        <img class="marca-mascote" src="assets/mascote.png" alt="" width="40" height="40">
        <img class="marca-nome" src="assets/wordmark.png" alt="Choppatinhas" width="206" height="50">
      </a>
      <button class="topo-busca" id="btnBusca" aria-label="Buscar no cardápio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </div>
    <div class="busca" id="busca" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="buscaInput" type="search" placeholder="Batata, picanha, calabresa…" autocomplete="off" enterkeyhint="search">
      <button id="buscaFechar" class="busca-x" aria-label="Fechar busca">Cancelar</button>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero" id="hero">
    <div class="hero-luz" aria-hidden="true"></div>
    <div class="hero-bolhas" aria-hidden="true"></div>
    <div class="hero-in">
      <div class="status" id="status"><span class="status-dot"></span><span id="statusTxt">Carregando…</span></div>
      <h1 class="hero-titulo">O sabor da casa,<br><span>agora na sua mesa.</span></h1>
      <p class="hero-sub">Peça em poucos toques e receba quentinho em casa, ou passe pra retirar.</p>
      <ul class="hero-info" id="heroInfo"></ul>
    </div>
    <div class="destaques" id="destaques" aria-label="Destaques da casa"></div>
    <div class="destaques-dots" id="destaquesDots"></div>
  </section>

  <!-- ACOMPANHAR / PEDIR DE NOVO -->
  <section class="retorno" id="retorno" hidden></section>

  <!-- CATEGORIAS -->
  <nav class="cats" id="cats" aria-label="Categorias">
    <div class="cats-in" id="catsIn"></div>
  </nav>

  <!-- PRODUTOS -->
  <main class="menu" id="menu">
    <div class="skeleton" id="skeleton">
      <div class="sk sk-t"></div>
      <div class="sk-grid"><div class="sk sk-c"></div><div class="sk sk-c"></div><div class="sk sk-c"></div><div class="sk sk-c"></div></div>
    </div>
  </main>

  <div class="busca-vazia" id="buscaVazia" hidden>
    <p>Não achamos <strong id="buscaTermo"></strong> por aqui 🤔</p>
    <span>Tenta outra palavra, tipo “frango” ou “batata”.</span>
  </div>

  <footer class="rodape" id="rodape">
    <img src="assets/wordmark.png" alt="Choppatinhas" width="180" height="44" loading="lazy">
    <p id="rodapeEnd"></p>
    <p id="rodapeHora"></p>
    <button class="btn-admin" id="btnAdmin" aria-label="Acesso administrativo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </footer>

  <!-- BARRA FLUTUANTE DO CARRINHO -->
  <div class="barra" id="barra" hidden>
    <button class="barra-btn" id="barraBtn">
      <span class="barra-qtd" id="barraQtd">0</span>
      <span class="barra-txt">
        <strong>Ver pedido</strong>
        <small id="barraMeta"></small>
      </span>
      <span class="barra-total" id="barraTotal">R$ 0,00</span>
      <span class="barra-prog"><i id="barraProg"></i></span>
    </button>
  </div>

  <!-- CAMADAS (sheets / modais) -->
  <div class="veu" id="veu"></div>
  <section class="sheet" id="sheetProduto" role="dialog" aria-modal="true" aria-label="Produto"></section>
  <section class="sheet sheet-carrinho" id="sheetCarrinho" role="dialog" aria-modal="true" aria-label="Seu pedido"></section>
  <section class="sheet sheet-checkout" id="sheetCheckout" role="dialog" aria-modal="true" aria-label="Finalizar pedido"></section>
  <section class="sheet sheet-status" id="sheetStatus" role="dialog" aria-modal="true" aria-label="Acompanhar pedido"></section>

  <!-- ADMIN -->
  <div class="adm-senha" id="admSenha" hidden>
    <form class="adm-senha-box" id="admSenhaForm">
      <img src="assets/mascote.png" alt="" width="56" height="56">
      <h3>Área da casa</h3>
      <p>Digite a senha do painel</p>
      <input type="password" id="admSenhaInput" inputmode="numeric" maxlength="12" placeholder="••••" autocomplete="off">
      <small class="adm-erro" id="admErro" hidden>Senha incorreta</small>
      <div class="adm-senha-acoes">
        <button type="button" class="btn-ghost" id="admCancelar">Cancelar</button>
        <button type="submit" class="btn-cta">Entrar</button>
      </div>
    </form>
  </div>
  <section class="adm" id="adm" hidden></section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="voa" id="voa" aria-hidden="true"></div>
</body>
</html>
